<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard de Ventas</title>
  <style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #fff5f7; color: #72243E; }

    header {
      background: #993556; color: white; padding: 1rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 1.4rem; }
    header nav { display: flex; gap: 1.5rem; }
    header a { color: #F4C0D1; text-decoration: none; font-size: 0.9rem; }
    header a:hover { color: white; }

    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem; margin-bottom: 2rem;
    }
    .stat-card {
      background: white; border-radius: 16px; padding: 1.25rem;
      border: 0.5px solid #F4C0D1;
    }
    .stat-card .label { font-size: 0.8rem; color: #D4537E; margin-bottom: 0.4rem; }
    .stat-card .value { font-size: 2rem; font-weight: bold; color: #72243E; }
    .stat-card .value.green { color: #993556; }
    .stat-card .value.red { color: #D4537E; }
    .stat-card .value.blue { color: #993556; }

    .cards-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem; margin-bottom: 2rem;
    }
    @media (max-width: 600px) { .cards-row { grid-template-columns: 1fr; } }

    .panel {
      background: white; border-radius: 16px; padding: 1.25rem;
      border: 0.5px solid #F4C0D1;
    }
    .panel h3 { font-size: 1rem; color: #993556; margin-bottom: 1rem; }

    .bar-row { margin-bottom: 0.9rem; }
    .bar-row .bar-label {
      display: flex; justify-content: space-between;
      font-size: 0.85rem; margin-bottom: 4px; color: #72243E;
    }
    .bar-track {
      background: #FBEAF0; border-radius: 6px; height: 10px; overflow: hidden;
    }
    .bar-fill { height: 10px; border-radius: 6px; transition: width 0.6s ease; }
    .bar-vip  { background: #993556; }
    .bar-pref { background: #D4537E; }
    .bar-gen  { background: #ED93B1; }

    .event-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.6rem 0; border-bottom: 1px solid #FBEAF0; font-size: 0.9rem;
      color: #72243E;
    }
    .event-row:last-child { border-bottom: none; }
    .badge {
      padding: 0.25rem 0.7rem; border-radius: 20px; font-size: 0.75rem; font-weight: bold;
    }
    .badge.active { background: #FBEAF0; color: #72243E; }
    .badge.cancelled { background: #F4C0D1; color: #4B1528; }

    .top-event {
      background: #FBEAF0; border-radius: 12px; padding: 1rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .top-event .name { font-weight: bold; color: #72243E; }
    .top-event .detail { font-size: 0.85rem; color: #993556; margin-top: 0.2rem; }
    .top-event .trophy { font-size: 2rem; }
  </style>
</head>
<body>

<header>
  <h1>📊 Dashboard de Ventas</h1>
  <nav>
    <a href="index.html">Portal Público</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<div class="container">

  <!-- Tarjetas de resumen -->
  <div class="stats-grid" id="statsGrid"></div>

  <div class="cards-row">
    <!-- Boletos por zona -->
    <div class="panel">
      <h3>🎟 Boletos disponibles por zona</h3>
      <div id="zonesBars"></div>
    </div>

    <!-- Lista de eventos -->
    <div class="panel">
      <h3>📅 Estado de eventos</h3>
      <div id="eventsList"></div>
    </div>
  </div>

  <!-- Evento más popular -->
  <div class="panel">
    <h3>🏆 Evento con más boletos disponibles</h3>
    <div id="topEvent"></div>
  </div>

</div>

<script src="js/mockData.js"></script>
<script>
  function buildDashboard() {
    const events = mockEvents;
    const active = events.filter(e => e.status === "Active");
    const cancelled = events.filter(e => e.status === "Cancelled");

    let totalVIP = 0, totalPref = 0, totalGen = 0;
    events.forEach(ev => {
      ev.zones.forEach(z => {
        if (z.name === "VIP") totalVIP += z.available;
        if (z.name === "Preferente") totalPref += z.available;
        if (z.name === "General") totalGen += z.available;
      });
    });
    const totalBoletos = totalVIP + totalPref + totalGen;

    let ingresosPotenciales = 0;
    events.forEach(ev => {
      ev.zones.forEach(z => {
        ingresosPotenciales += z.price * z.available;
      });
    });

    // Stats
    document.getElementById("statsGrid").innerHTML = `
      <div class="stat-card">
        <div class="label">Total de eventos</div>
        <div class="value">${events.length}</div>
      </div>
      <div class="stat-card">
        <div class="label">Eventos activos</div>
        <div class="value green">${active.length}</div>
      </div>
      <div class="stat-card">
        <div class="label">Eventos cancelados</div>
        <div class="value red">${cancelled.length}</div>
      </div>
      <div class="stat-card">
        <div class="label">Boletos disponibles</div>
        <div class="value blue">${totalBoletos.toLocaleString("es-MX")}</div>
      </div>
      <div class="stat-card">
        <div class="label">Ingresos potenciales</div>
        <div class="value">$${ingresosPotenciales.toLocaleString("es-MX")}</div>
      </div>
    `;

    // Barras por zona
    const maxZone = Math.max(totalVIP, totalPref, totalGen);
    document.getElementById("zonesBars").innerHTML = `
      <div class="bar-row">
        <div class="bar-label"><span>VIP</span><span>${totalVIP} boletos</span></div>
        <div class="bar-track"><div class="bar-fill bar-vip" style="width:${Math.round(totalVIP/maxZone*100)}%"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>Preferente</span><span>${totalPref} boletos</span></div>
        <div class="bar-track"><div class="bar-fill bar-pref" style="width:${Math.round(totalPref/maxZone*100)}%"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>General</span><span>${totalGen} boletos</span></div>
        <div class="bar-track"><div class="bar-fill bar-gen" style="width:${Math.round(totalGen/maxZone*100)}%"></div></div>
      </div>
    `;

    // Lista de eventos
    document.getElementById("eventsList").innerHTML = events.map(ev => `
      <div class="event-row">
        <span>${ev.name}</span>
        <span class="badge ${ev.status === 'Active' ? 'active' : 'cancelled'}">
          ${ev.status === 'Active' ? 'Activo' : 'Cancelado'}
        </span>
      </div>
    `).join("");

    // Top evento
    const top = events.reduce((prev, curr) => {
      const prevTotal = prev.zones.reduce((s, z) => s + z.available, 0);
      const currTotal = curr.zones.reduce((s, z) => s + z.available, 0);
      return currTotal > prevTotal ? curr : prev;
    });
    const topTotal = top.zones.reduce((s, z) => s + z.available, 0);
    const topDate = new Date(top.date).toLocaleDateString("es-MX", { year: "numeric", month: "long", day: "numeric" });

    document.getElementById("topEvent").innerHTML = `
      <div class="top-event">
        <div>
          <div class="name">${top.name}</div>
          <div class="detail">📍 ${top.location} · 📅 ${topDate}</div>
          <div class="detail" style="margin-top:0.3rem;">🎟 ${topTotal.toLocaleString("es-MX")} boletos disponibles</div>
        </div>
        <div class="trophy">🏆</div>
      </div>
    `;
  }

  buildDashboard();
</script>
</body>
</html>
