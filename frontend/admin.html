<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel de Administración</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #fff5f7; color: #72243E; }

    header {
      background: #993556; color: white; padding: 1rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 1.4rem; }
    header a { color: #F4C0D1; text-decoration: none; font-weight: bold; }
    header a:hover { color: white; }

    .toolbar {
      max-width: 1000px; margin: 2rem auto 1rem; padding: 0 1rem;
      display: flex; gap: 1rem; align-items: center;
    }
    .toolbar input {
      flex: 1; padding: 0.65rem 1rem; border-radius: 20px;
      border: 1px solid #ED93B1; font-size: 1rem;
      background: white; color: #72243E; outline: none;
    }
    .btn-new {
      padding: 0.65rem 1.4rem; background: #993556; color: white;
      border: none; border-radius: 20px; cursor: pointer; font-size: 1rem; white-space: nowrap;
    }
    .btn-new:hover { background: #72243E; }

    .table-wrap {
      max-width: 1000px; margin: 0 auto; padding: 0 1rem 3rem; overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 16px; overflow: hidden; border: 0.5px solid #F4C0D1; }
    thead { background: #993556; color: white; }
    th, td { padding: 0.9rem 1rem; text-align: left; font-size: 0.95rem; }
    tbody tr:hover { background: #fff5f7; }
    tbody tr { border-bottom: 1px solid #FBEAF0; }

    .badge { padding: 0.3rem 0.75rem; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
    .badge.active { background: #FBEAF0; color: #72243E; }
    .badge.cancelled { background: #F4C0D1; color: #4B1528; }

    .btn-edit {
      padding: 0.35rem 0.8rem; background: #F4C0D1; color: #72243E;
      border: none; border-radius: 20px; cursor: pointer; font-size: 0.85rem; margin-right: 0.4rem;
    }
    .btn-edit:hover { background: #ED93B1; }
    .btn-cancel {
      padding: 0.35rem 0.8rem; background: #993556; color: white;
      border: none; border-radius: 20px; cursor: pointer; font-size: 0.85rem;
    }
    .btn-cancel:hover { background: #72243E; }
    .btn-cancel:disabled { background: #F4C0D1; color: #993556; cursor: not-allowed; }

    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(153,53,86,0.3); z-index: 100; justify-content: center; align-items: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white; border-radius: 20px; padding: 2rem;
      width: 90%; max-width: 500px; position: relative;
      border: 0.5px solid #F4C0D1;
    }
    .modal h2 { margin-bottom: 1.5rem; color: #72243E; }
    .modal label { display: block; margin-bottom: 0.3rem; font-weight: 600; font-size: 0.9rem; color: #993556; }
    .modal input, .modal textarea {
      width: 100%; padding: 0.6rem; border: 1px solid #ED93B1;
      border-radius: 10px; margin-bottom: 0.4rem; font-size: 1rem; font-family: inherit; color: #72243E;
    }
    .modal textarea { height: 80px; resize: vertical; }
    .error-msg { color: #D4537E; font-size: 0.8rem; display: block; margin-bottom: 0.75rem; }
    .modal-actions { display: flex; gap: 1rem; justify-content: flex-end; margin-top: 0.5rem; }
    .btn-save {
      padding: 0.6rem 1.5rem; background: #993556; color: white;
      border: none; border-radius: 20px; cursor: pointer; font-size: 1rem;
    }
    .btn-save:hover { background: #72243E; }
    .btn-close-modal {
      padding: 0.6rem 1.5rem; background: #FBEAF0; color: #72243E;
      border: none; border-radius: 20px; cursor: pointer; font-size: 1rem;
    }
    .btn-close-modal:hover { background: #F4C0D1; }
  </style>
</head>
<body>

<header>
  <h1 id="adminTitle">⚙️ Panel de Administración</h1>
  <nav style="display:flex; gap:1.5rem; align-items:center;">
    <a href="index.html" style="color:#F4C0D1; text-decoration:none; font-size:0.9rem;">← Portal Público</a>
    <button onclick="logout()" style="background:#72243E; color:white; border:none; border-radius:20px; padding:0.4rem 1rem; cursor:pointer; font-size:0.85rem;">Cerrar sesión</button>
  </nav>
</header>

<div class="toolbar">
  <input type="text" id="searchAdmin" placeholder="Buscar evento..." oninput="filterTable()" />
  <button class="btn-new" onclick="openCreate()">+ Nuevo Evento</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Nombre</th>
        <th>Fecha</th>
        <th>Lugar</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="eventsTableBody"></tbody>
  </table>
</div>

<div class="modal-overlay" id="formModal">
  <div class="modal">
    <h2 id="modalTitle">Nuevo Evento</h2>

    <label>Nombre *</label>
    <input type="text" id="fieldName" placeholder="Nombre del evento" />
    <span class="error-msg" id="error-name"></span>

    <label>Descripción</label>
    <textarea id="fieldDesc" placeholder="Descripción del evento"></textarea>

    <label>Fecha y Hora *</label>
    <input type="datetime-local" id="fieldDate" />
    <span class="error-msg" id="error-date"></span>

    <label>Lugar *</label>
    <input type="text" id="fieldLocation" placeholder="Lugar del evento" />
    <span class="error-msg" id="error-location"></span>

    <div class="modal-actions">
      <button class="btn-close-modal" onclick="closeFormModal()">Cancelar</button>
      <button class="btn-save" onclick="saveEvent()">Guardar</button>
    </div>
  </div>
</div>

<script src="js/mockData.js"></script>
<script>
  const token = localStorage.getItem("token");
  if (!token) window.location.href = "login.html";

  const user = localStorage.getItem("user");
  if (user) {
    document.getElementById("adminTitle").textContent = `⚙️ Panel de Administración — ${user}`;
  }

  function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.href = "login.html";
  }
</script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
