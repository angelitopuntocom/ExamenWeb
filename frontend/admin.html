<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel de Administración</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f4f6fb; color: #222; }

    header {
      background: #1a1a2e; color: white; padding: 1rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 1.4rem; }
    header a { color: #e94560; text-decoration: none; font-weight: bold; }

    .toolbar {
      max-width: 1000px; margin: 2rem auto 1rem; padding: 0 1rem;
      display: flex; gap: 1rem; align-items: center;
    }
    .toolbar input {
      flex: 1; padding: 0.65rem 1rem; border-radius: 8px;
      border: 1px solid #ddd; font-size: 1rem;
    }
    .btn-new {
      padding: 0.65rem 1.4rem; background: #1a1a2e; color: white;
      border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; white-space: nowrap;
    }
    .btn-new:hover { background: #2d2d4e; }

    .table-wrap {
      max-width: 1000px; margin: 0 auto; padding: 0 1rem 3rem; overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    thead { background: #1a1a2e; color: white; }
    th, td { padding: 0.9rem 1rem; text-align: left; font-size: 0.95rem; }
    tbody tr:hover { background: #f9f9f9; }
    tbody tr { border-bottom: 1px solid #eee; }

    .badge {
      padding: 0.3rem 0.75rem; border-radius: 20px; font-size: 0.8rem; font-weight: bold;
    }
    .badge.active { background: #d4edda; color: #155724; }
    .badge.cancelled { background: #f8d7da; color: #721c24; }

    .btn-edit {
      padding: 0.35rem 0.8rem; background: #ffc107; color: #222;
      border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; margin-right: 0.4rem;
    }
    .btn-edit:hover { background: #e0a800; }
    .btn-cancel {
      padding: 0.35rem 0.8rem; background: #e94560; color: white;
      border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    }
    .btn-cancel:hover { background: #c73652; }
    .btn-cancel:disabled { background: #ccc; cursor: not-allowed; }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white; border-radius: 14px; padding: 2rem;
      width: 90%; max-width: 500px; position: relative;
    }
    .modal h2 { margin-bottom: 1.5rem; color: #1a1a2e; }
    .modal label { display: block; margin-bottom: 0.3rem; font-weight: 600; font-size: 0.9rem; }
    .modal input, .modal textarea {
      width: 100%; padding: 0.6rem; border: 1px solid #ddd;
      border-radius: 6px; margin-bottom: 1rem; font-size: 1rem; font-family: inherit;
    }
    .modal textarea { height: 80px; resize: vertical; }
    .modal-actions { display: flex; gap: 1rem; justify-content: flex-end; }
    .btn-save {
      padding: 0.6rem 1.5rem; background: #1a1a2e; color: white;
      border: none; border-radius: 8px; cursor: pointer; font-size: 1rem;
    }
    .btn-save:hover { background: #2d2d4e; }
    .btn-close-modal {
      padding: 0.6rem 1.5rem; background: #eee; color: #444;
      border: none; border-radius: 8px; cursor: pointer; font-size: 1rem;
    }
    .btn-close-modal:hover { background: #ddd; }
  </style>
</head>
<body>

<header>
  <h1>⚙️ Panel de Administración</h1>
  <a href="index.html">← Portal Público</a>
</header>

<div class="toolbar">
  <input type="text" id="searchAdmin" placeholder="Buscar evento..." oninput="filterTable()" />
  <button class="btn-new" onclick="openCreate()">+ Nuevo Evento</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Nombre</th>
        <th>Fecha</th>
        <th>Lugar</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="eventsTableBody"></tbody>
  </table>
</div>

<!-- Modal formulario -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <h2 id="modalTitle">Nuevo Evento</h2>

    <label>Nombre *</label>
    <input type="text" id="fieldName" placeholder="Nombre del evento" />

    <label>Descripción</label>
    <textarea id="fieldDesc" placeholder="Descripción del evento"></textarea>

    <label>Fecha y Hora *</label>
    <input type="datetime-local" id="fieldDate" />

    <label>Lugar *</label>
    <input type="text" id="fieldLocation" placeholder="Lugar del evento" />

    <div class="modal-actions">
      <button class="btn-close-modal" onclick="closeFormModal()">Cancelar</button>
      <button class="btn-save" onclick="saveEvent()">Guardar</button>
    </div>
  </div>
</div>

<script src="js/mockData.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
